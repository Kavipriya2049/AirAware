<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirAware</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f4;--card:#fff;--ink:#12303a;--mute:#5d7780;--line:#d3e0e3;--road:#dbe6e8;--g:#1f9d6b;--y:#d99a1b;--o:#e07a2b;--r:#d4483b;--p:#8a4fb0;--acc:#0f6b7a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c20;--card:#17292f;--ink:#e3f0f2;--mute:#8fa9b0;--line:#27414a;--road:#22373e;--g:#3fcf95;--y:#f0b83c;--o:#f29a55;--r:#f06a5c;--p:#b987dc;--acc:#5cc3d3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c20;--card:#17292f;--ink:#e3f0f2;--mute:#8fa9b0;--line:#27414a;--road:#22373e;--g:#3fcf95;--y:#f0b83c;--o:#f29a55;--r:#f06a5c;--p:#b987dc;--acc:#5cc3d3;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Sora,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.4px}h2{font-size:15px;margin:0 0 8px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}.note{font-size:12px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
svg{width:100%;height:auto;display:block;border-radius:10px;background:var(--bg)}
label{display:block;font-size:13px;margin:8px 0 2px;color:var(--mute)}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input[type=range]{padding:0;accent-color:var(--acc)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.pri{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--card);font:600 15px Sora,system-ui,sans-serif;cursor:pointer}
button.sec{padding:7px 12px;border:1px solid var(--acc);border-radius:99px;background:none;color:var(--acc);font:inherit;font-size:13px;cursor:pointer}
.err{color:var(--r);font-size:13px;min-height:18px;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font-size:12px;padding:4px 0}
nav a b{display:block;font-size:19px;font-weight:400}nav a.on{color:var(--acc);font-weight:700}
.rc{border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.rc.sel{border-color:var(--acc)}.rc .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.tag{font-size:11px;background:var(--acc);color:var(--card);padding:1px 8px;border-radius:99px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px;font-size:12px;color:var(--mute)}.st b{display:block;color:var(--ink);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
.big{font-size:48px;font-weight:700;line-height:1}
.fc{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}.fc div{flex:1;border-radius:4px 4px 0 0}
.fl{display:flex;gap:4px;font-size:10px;color:var(--mute)}.fl span{flex:1;text-align:center}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.li span:nth-child(2){flex:1}.leg{display:flex;flex-wrap:wrap;gap:8px;font-size:12px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.av{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--card);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sg div{text-align:center}.sg b{font-size:24px;display:block}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script>
var S=.04,BASE=60,user=null,mem=null,selP=3,aqP=3,rt={from:0,to:6,traffic:0,sel:-1},RS=[];
var P=[['Green Park',35,240],['Old Market',80,130],['University',50,45],['Central Station',180,150],['Lake View',150,250],['Industrial Zone',130,70],['Tech Park',320,45],['Airport',320,170],['Riverside',260,245],['Civil Lines',250,100]];
var E=[[0,1,40],[0,4,45],[1,2,40],[1,3,45],[1,5,40],[2,5,45],[3,5,40],[3,9,50],[3,4,40],[3,7,50],[4,8,45],[8,7,45],[5,9,50],[9,6,50],[7,6,50],[7,9,40],[3,8,40]];
var H=[[180,150,60,210],[130,70,45,190],[80,130,35,150],[320,170,35,140],[165,245,50,45],[260,245,40,55]];
var VC={petrol:{n:'Petrol car',f:120,cap:999},diesel:{n:'Diesel car',f:135,cap:999},ev:{n:'Electric car',f:40,cap:999},bike:{n:'Bike',f:0,cap:20}};
function aqi(x,y){var v=BASE;H.forEach(function(h){var d=Math.hypot(x-h[0],y-h[1]);if(d<h[2])v+=(h[3]-BASE)*(1-d/h[2])});return v}
P.forEach(function(p){p[3]=aqi(p[1],p[2])});
var EG=E.map(function(e,i){var A=P[e[0]],B=P[e[1]],s=0;for(var k=0;k<=4;k++)s+=aqi(A[1]+(B[1]-A[1])*k/4,A[2]+(B[2]-A[2])*k/4);return{id:i,a:e[0],b:e[1],km:Math.hypot(A[1]-B[1],A[2]-B[2])*S,sp:e[2],aq:s/5}});
function cat(a){return a<=50?['Good','--g','Fine for outdoor activity.']:a<=100?['Moderate','--y','Acceptable. Very sensitive people should limit long outdoor effort.']:a<=150?['Unhealthy for sensitive groups','--o','Children and people with breathing problems should spend less time outdoors.']:a<=200?['Unhealthy','--r','Wear a mask outdoors and avoid heavy exercise.']:['Very unhealthy','--p','Avoid outdoor activity if you can.']}
function col(a){return 'var('+cat(a)[1]+')'}
function $(i){return document.getElementById(i)}
function save(){try{localStorage.setItem('aa_user',JSON.stringify(user))}catch(e){mem=JSON.stringify(user)}}
function load(){try{var s=localStorage.getItem('aa_user');if(s)user=JSON.parse(s)}catch(e){if(mem)user=JSON.parse(mem)}}
function opts(sel){return P.map(function(p,i){return '<option value="'+i+'"'+(i==sel?' selected':'')+'>'+p[0]+'</option>'}).join('')}
function map(o){var s='';
EG.forEach(function(e){var A=P[e.a],B=P[e.b];s+='<line x1="'+A[1]+'" y1="'+A[2]+'" x2="'+B[1]+'" y2="'+B[2]+'" stroke="var(--road)" stroke-width="7" stroke-linecap="round"/>'});
H.forEach(function(h){s+='<circle cx="'+h[0]+'" cy="'+h[1]+'" r="'+h[2]+'" fill="'+col(h[3])+'" fill-opacity=".2"/>'});
(o.routes||[]).forEach(function(r,j){var on=j==o.sel;s+='<polyline points="'+r.nodes.map(function(n){return P[n][1]+','+P[n][2]}).join(' ')+'" fill="none" stroke="'+col(r.aq)+'" stroke-width="'+(on?6:3)+'" stroke-linecap="round" stroke-linejoin="round" opacity="'+(on?1:.5)+'"'+(on?'':' stroke-dasharray="1 7"')+'/>'});
P.forEach(function(p,i){var on=i==o.a||i==o.b||i==o.hi;s+='<g'+(o.click?' onclick="tapP('+i+')" style="cursor:pointer"':'')+'><circle cx="'+p[1]+'" cy="'+p[2]+'" r="'+(on?8:5)+'" fill="'+col(p[3])+'" stroke="var(--ink)" stroke-width="'+(on?2.5:1)+'"/><text x="'+p[1]+'" y="'+(p[2]+(on?20:16))+'" font-size="9.5" text-anchor="middle" fill="var(--ink)" stroke="var(--bg)" stroke-width="3" style="paint-order:stroke">'+p[0]+'</text></g>'});
return '<svg viewBox="0 0 360 280" role="img" aria-label="City map with pollution zones">'+s+'</svg>'}
function et(e){return e.km/Math.min(e.sp,VC[user.veh].cap)*60*(rt.traffic&&e.aq>120?1.5:1)}
function cost(e,m){var t=et(e);return m=='f'?t:m=='c'?e.aq*e.km/10+t*.15:t+e.km*(e.aq-60)/10}
function dij(s,t,m,pen){var d=[],pv=[],dn=[],N=P.length,i;for(i=0;i<N;i++)d[i]=1e9;d[s]=0;
for(;;){var u=-1;for(i=0;i<N;i++)if(!dn[i]&&(u<0||d[i]<d[u]))u=i;if(u<0||d[u]>=1e9)break;dn[u]=1;if(u==t)break;
EG.forEach(function(e){if(e.a!=u&&e.b!=u)return;var v=e.a==u?e.b:e.a,c=d[u]+cost(e,m)*(1+.7*(pen[e.id]||0));if(c<d[v]){d[v]=c;pv[v]=[u,e]}})}
var nodes=[t],es=[],c=t;while(c!=s){var q=pv[c];es.unshift(q[1]);c=q[0];nodes.unshift(c)}
var km=0,tm=0,ax=0,kg=0;es.forEach(function(e){km+=e.km;tm+=et(e);ax+=e.aq*e.km;kg+=e.km*VC[user.veh].f*(rt.traffic&&e.aq>120?1.3:1)/1000});
return{nodes:nodes,es:es,km:km,t:tm,aq:ax/km,kg:kg}}
function find(a,b){var out=[],seen={};
function add(r,l){var k=r.nodes.join();if(seen[k])return;seen[k]=1;r.label=l;out.push(r)}
add(dij(a,b,'f',{}),'Fastest');add(dij(a,b,'c',{}),'Cleanest');add(dij(a,b,'b',{}),'Balanced');
for(var n=1;n<=3&&out.length<3;n++){var pen={};out.forEach(function(r){r.es.forEach(function(e){pen[e.id]=(pen[e.id]||0)+n})});add(dij(a,b,'b',pen),'Alternative')}
return out}
function calc(reset){if(reset)rt.sel=-1;var el=$('res');
if(rt.from==rt.to){el.innerHTML='<div class="card">Choose two different places.</div>';return}
var R=find(rt.from,rt.to),w=user.w,tm=Math.min.apply(null,R.map(function(r){return r.t})),am=Math.min.apply(null,R.map(function(r){return r.aq})),rec=0,bs=1e9;
R.forEach(function(r,j){var s=w*r.t/tm+(1-w)*r.aq/am;if(s<bs){bs=s;rec=j}});
if(rt.sel<0||rt.sel>=R.length)rt.sel=rec;RS=R;rt.rec=rec;
var fa=R.reduce(function(a,r){return r.t<a.t?r:a},R[0]),h='<div class="card">'+map({routes:R,sel:rt.sel,a:rt.from,b:rt.to})+'</div>';
R.forEach(function(r,j){var c=cat(r.aq),dl='';
if(r!=fa)dl='<div class="note">vs fastest: AQI '+((r.aq-fa.aq)/fa.aq*100).toFixed(0)+'%, '+(r.t-fa.t>=0?'+':'')+(r.t-fa.t).toFixed(0)+' min, CO₂ '+((r.kg-fa.kg)/(fa.kg||1)*100).toFixed(0)+'%</div>';
h+='<div class="rc'+(j==rt.sel?' sel':'')+'" onclick="rt.sel='+j+';calc()"><div class="t"><span class="dot" style="background:'+col(r.aq)+'"></span>'+r.label+(j==rec?' <span class="tag">Recommended</span>':'')+'</div><div class="st"><span><b>'+r.km.toFixed(1)+'</b>km</span><span><b>'+Math.round(r.t)+'</b>min</span><span><b>'+Math.round(r.aq)+'</b>AQI</span><span><b>'+r.kg.toFixed(2)+'</b>kg CO₂</span></div><div class="note">'+c[0]+' exposure via '+r.nodes.map(function(n){return P[n][0]}).join(', ')+'</div>'+dl+(j==rt.sel?'<button class="pri" style="margin-top:8px;padding:9px" onclick="event.stopPropagation();useRt()">Use this route</button>':'')+'</div>'});
el.innerHTML=h+'<p class="note" id="msg">Values are estimated for a simulated city. Vehicle type changes emissions only.</p>'}
function useRt(){var r=RS[rt.sel],f=RS.reduce(function(a,x){return x.t<a.t?x:a},RS[0]);user.trips=(user.trips||0)+1;user.saved=(user.saved||0)+Math.max(0,f.kg-r.kg);save();$('msg').textContent='Route added to your trips. Check your profile.'}
function tapP(i){selP=i;view()}
var pages={
signup:function(){return '<h1>Create your account</h1><p class="sub">Plan trips that are quick and kinder to your lungs.</p><div class="card"><label>Name</label><input id="sn" autocomplete="name"><label>Email</label><input id="se" type="email" autocomplete="email"><label>Password</label><input id="sp" type="password" autocomplete="new-password" placeholder="At least 6 characters"><div class="row"><div><label>Vehicle</label><select id="sv">'+Object.keys(VC).map(function(k){return '<option value="'+k+'">'+VC[k].n+'</option>'}).join('')+'</select></div><div><label>Home area</label><select id="sh">'+opts(0)+'</select></div></div><div class="err" id="err"></div><button class="pri" onclick="signup()">Sign up</button></div><p class="note">Demo only: your details stay in this browser and the password is not stored.</p>'},
map:function(){var p=P[selP],c=cat(p[3]);return '<h1>Pollution map</h1><p class="sub">Tap a place to see its estimated air quality.</p><div class="card">'+map({click:1,hi:selP})+'</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2 style="margin:0">'+p[0]+'</h2><span style="color:var(--'+c[1].slice(2)+');font-weight:600">'+c[0]+'</span></div><div class="big" style="color:'+col(p[3])+'">'+Math.round(p[3])+'</div></div><p class="note">'+c[2]+'</p><button class="sec" onclick="rt.from='+selP+';location.hash=\'routes\'">Route from here</button></div><div class="card leg"><span><i style="background:var(--g)"></i>Good</span><span><i style="background:var(--y)"></i>Moderate</span><span><i style="background:var(--o)"></i>Sensitive groups</span><span><i style="background:var(--r)"></i>Unhealthy</span><span><i style="background:var(--p)"></i>Very unhealthy</span></div>'},
routes:function(){return '<h1>Route finder</h1><p class="sub">Compare the fastest, cleanest and balanced way to travel.</p><div class="card"><div class="row"><div><label>From</label><select onchange="rt.from=+this.value;calc(1)">'+opts(rt.from)+'</select></div><div><label>To</label><select onchange="rt.to=+this.value;calc(1)">'+opts(rt.to)+'</select></div></div><label>Traffic</label><select onchange="rt.traffic=+this.value;calc(1)"><option value="0">Normal</option><option value="1"'+(rt.traffic?' selected':'')+'>Heavy (rush hour)</option></select><label>Priority: <b id="wl"></b></label><input type="range" min="0" max="100" value="'+user.w*100+'" oninput="user.w=this.value/100;save();wlab();calc(1)"><div class="note" style="display:flex;justify-content:space-between"><span>Cleanest air</span><span>Fastest arrival</span></div></div><div id="res"></div>'},
aqi:function(){var p=P[aqP],c=cat(p[3]),hr=new Date().getHours(),f=function(h){return 1+.3*Math.exp(-Math.pow(h-9,2)/4)+.35*Math.exp(-Math.pow(h-18.5,2)/5)},k=p[3]/f(hr),v=[],best=0;
for(var i=0;i<12;i++){v.push(k*f((hr+i)%24));if(v[i]<v[best])best=i}
var mx=Math.max.apply(null,v),bars='',lab='';v.forEach(function(a,i){bars+='<div style="height:'+(a/mx*100)+'%;background:'+col(a)+'"></div>';lab+='<span>'+(i%2?'':(hr+i)%24)+'</span>'});
var order=P.map(function(q,i){return i}).sort(function(a,b){return P[b][3]-P[a][3]});
return '<h1>Air quality</h1><p class="sub">Estimated AQI for each area.</p><div class="chips">'+P.map(function(q,i){return '<button class="chip'+(i==aqP?' on':'')+'" onclick="aqP='+i+';view()">'+q[0]+'</button>'}).join('')+'</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2 style="margin:0">'+p[0]+'</h2><span style="color:var(--'+c[1].slice(2)+');font-weight:600">'+c[0]+'</span></div><div class="big" style="color:'+col(p[3])+'">'+Math.round(p[3])+'</div></div><p class="note">'+c[2]+'</p></div><div class="card"><h2>Next 12 hours (predicted)</h2><div class="fc">'+bars+'</div><div class="fl">'+lab+'</div><p class="note">Cleanest time to travel: around '+(hr+best)%24+':00 (AQI ~'+Math.round(v[best])+'). Peaks follow morning and evening traffic.</p></div><div class="card"><h2>All areas, worst first</h2>'+order.map(function(i){return '<div class="li" onclick="aqP='+i+';view()"><span class="dot" style="background:'+col(P[i][3])+'"></span><span>'+P[i][0]+'</span><b>'+Math.round(P[i][3])+'</b></div>'}).join('')+'</div>'},
profile:function(){return '<h1>Profile</h1><div class="card" style="display:flex;gap:14px;align-items:center"><div class="av">'+user.name.charAt(0).toUpperCase()+'</div><div><h2 style="margin:0">'+esc(user.name)+'</h2><span class="note">'+esc(user.email)+'</span></div></div><div class="card sg"><div><b>'+(user.trips||0)+'</b><span class="note">Trips planned</span></div><div><b>'+(user.saved||0).toFixed(2)+'</b><span class="note">kg CO₂ avoided</span></div></div><div class="card"><h2>Preferences</h2><label>Vehicle</label><select onchange="user.veh=this.value;save()">'+Object.keys(VC).map(function(k){return '<option value="'+k+'"'+(k==user.veh?' selected':'')+'>'+VC[k].n+'</option>'}).join('')+'</select><label>Home area</label><select onchange="user.home=+this.value;rt.from=user.home;save()">'+opts(user.home)+'</select><label>Default priority: <b id="wl"></b></label><input type="range" min="0" max="100" value="'+user.w*100+'" oninput="user.w=this.value/100;save();wlab()"><div class="note" style="display:flex;justify-content:space-between"><span>Cleanest air</span><span>Fastest arrival</span></div></div><button class="sec" style="width:100%;padding:11px" onclick="logout()">Log out</button>'}};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function wlab(){var e=$('wl');if(e)e.textContent=user.w<.34?'Clean air':user.w>.66?'Speed':'Balanced'}
function signup(){var n=$('sn').value.trim(),m=$('se').value.trim(),p=$('sp').value,er=$('err');
if(!n)return er.textContent='Enter your name.';if(!/^\S+@\S+\.\S+$/.test(m))return er.textContent='Enter a valid email address.';if(p.length<6)return er.textContent='Use a password with at least 6 characters.';
user={name:n,email:m,veh:$('sv').value,home:+$('sh').value,w:.5,trips:0,saved:0};rt.from=user.home;save();location.hash='map'}
function logout(){user=null;mem=null;try{localStorage.removeItem('aa_user')}catch(e){}location.hash='signup';view()}
function view(){var h=location.hash.slice(1)||'signup';if(!pages[h])h='signup';if(!user&&h!='signup'){h='signup';location.hash=h}if(user&&h=='signup'){h='map';location.hash=h}
$('app').innerHTML=pages[h]();
$('nav').innerHTML=user?[['map','🗺️','Map'],['routes','🧭','Route'],['aqi','🌫️','AQI'],['profile','👤','Profile']].map(function(t){return '<a href="#'+t[0]+'"'+(t[0]==h?' class="on"':'')+'><b>'+t[1]+'</b>'+t[2]+'</a>'}).join(''):'';
wlab();if(h=="routes")calc(1)}
window.onhashchange=function(){view();window.scrollTo(0,0)};load();view();
</script></body></html>
